name: homebrew

on:
  push:
    paths:
      - "homebrew/**"
      - "logos/export/icon.jpg"
      - ".github/workflows/homebrew.yml"
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Portlibs (switch-curl, switch-zlib) já vêm na imagem; pkg.devkitpro.org
      # devolve 403 para runners de CI, então não há dkp-pacman aqui.
      - name: Build spike
        run: make -C homebrew/spike

      - uses: actions/upload-artifact@v4
        with:
          name: ultranx-spike
          path: homebrew/spike/ultranx-spike.nro
          if-no-files-found: error
