name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ${{ matrix.os }}
    # Teto global: sem ele, um mirror do apt pendurado deixa o job "rodando" por
    # horas em vez de falhar — aconteceu, 50 min preso no apt-get update.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Dependências de sistema do Qt (Linux)
        # Os testes de entrypoint importam PyQt6.QtWidgets, que precisa destas
        # libs mesmo sem abrir janela: sem elas o import falha com
        # "libEGL.so.1: cannot open shared object file".
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libgl1
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Testes com cobertura
        # A camada core não depende de PyQt6; offscreen cobre o resto sem display.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=ultranx --cov-report=term-missing --cov-report=xml
      - name: Publicar cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
